# =============================================================================
#  Authelia — configuration principale
#  Les secrets (session, storage, jwt) sont fournis via des variables
#  d'environnement AUTHELIA_* définies dans docker-compose.yml → ne PAS les
#  mettre ici en clair.
#  Login servi sur https://auth.example.com (sous-domaine, 1 niveau → SSL gratuit).
# =============================================================================

server:
  address: "tcp://0.0.0.0:9091"

log:
  level: info

theme: dark

# --- Backend d'authentification : fichier local ------------------------------
authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id

# --- Contrôle d'accès --------------------------------------------------------
access_control:
  default_policy: two_factor          # id + mdp + 2FA sur TOUT (les apps)
  rules:
    - domain:
        - "auth.example.com"
      policy: bypass                  # le portail de login doit rester accessible

# --- Session -----------------------------------------------------------------
session:
  # secret fourni par l'env var AUTHELIA_SESSION_SECRET
  cookies:
    - domain: "example.com"             # couvre auth.example.com + content-creation.example.com
      authelia_url: "https://auth.example.com"
      default_redirection_url: "https://content-creation.example.com"
      expiration: "1h"
      inactivity: "5m"
      remember_me: "1M"

# --- Identité / reset password ----------------------------------------------
# reset_password DÉSACTIVÉ volontairement : pas de flux « email » (on veut
# uniquement du TOTP Google Authenticator). L'elevated_session (code ponctuel
# requis pour enregistrer un 2FA) reste actif avec ses valeurs par défaut et
# est délivré via le notifier filesystem (authelia/notifications.txt).

# --- Stockage (SQLite local, suffisant pour ce setup) ------------------------
storage:
  local:
    path: /config/db.sqlite3
  # encryption_key fourni par l'env var AUTHELIA_STORAGE_ENCRYPTION_KEY

# --- Notifications (fichier local, pour logs) --------------------------------
notifier:
  filesystem:
    filename: /config/notifications.txt
