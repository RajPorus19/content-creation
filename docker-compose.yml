# =============================================================================
#  content-creation — Reverse proxy + authentification (Traefik + Authelia)
#  Stack 100% locale. Aucun remote git, aucun push.
# =============================================================================
#
#  🌐 Exposition : via tunnel Cloudflare (cloudflared), PAS de port 80/443
#     exposé sur l'hôte. Dans le dashboard Cloudflare (Zero Trust), pointe
#     chaque hostname vers le service :  https://traefik:443
#     (et dans TLS → coche "No TLS Verify", le cert Traefik est auto-signé).
#     Seul le dashboard Traefik est mappé en local sur :8081 (accès admin).
#
#  Lancement :
#     cp .env.example .env    # remplis DOMAIN + secrets + CLOUDFLARE_TUNNEL_TOKEN
#     docker compose up -d

services:
  traefik:
    image: traefik:v3.7
    container_name: cc-traefik
    restart: unless-stopped
    # Traefik v3 tourne en non-root par défaut (uid 65532) → impossible de lire
    # /var/run/docker.sock (root:docker). On le fait tourner en root pour la
    # découverte Docker. Alternative plus stricte : group_add avec le gid docker.
    user: "0:0"
    ports:
      - "8081:8080"  # Dashboard / API local (NON protégé ici — voir README)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs
    networks:
      - proxy

  authelia:
    image: authelia/authelia:4.39.20
    container_name: cc-authelia
    restart: unless-stopped
    # uid/gid 1000 = ton utilisateur (USER) → droit d'écrire db.sqlite3 dans ./authelia
    user: "1000:1000"
    environment:
      # Secrets injectés depuis .env (variables AUTHELIA_*, voir .env.example)
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
    volumes:
      - ./authelia:/config
    expose:
      - "9091"
    labels:
      # Portail de connexion Authelia -> https://auth.${DOMAIN}
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.example.com`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.routers.authelia.middlewares=security-headers@file"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
    networks:
      - proxy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cc-cloudflared
    restart: unless-stopped
    environment:
      # Token du tunnel (depuis .env). Le routing hostname→service se configure
      # côté dashboard Cloudflare, PAS ici.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - proxy

  homer:
    image: b4bz/homer:latest
    container_name: cc-homer
    restart: unless-stopped
    volumes:
      - ./homer/assets:/www/assets
    labels:
      # Dashboard racine -> https://DOMAIN/  (catch-all du domaine)
      - "traefik.enable=true"
      - "traefik.http.routers.homer.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.homer.entrypoints=websecure"
      - "traefik.http.routers.homer.tls=true"
      - "traefik.http.routers.homer.middlewares=authelia-auth@file,security-headers@file"
      - "traefik.http.services.homer.loadbalancer.server.port=8080"
    networks:
      - proxy

  # ===========================================================================
  #  BrightBean Studio — gestion de contenus réseaux sociaux (Django + PostgreSQL)
  #  Exposé sur https://brightbean.example.com (sous-domaine 1 niveau, SSL gratuit)
  #  Protégé par Authelia (id + mdp + 2FA) via authelia-auth@file.
  #  ⚠️ Django ne supporte pas proprement le sous-chemin (/app) → sous-domaine.
  # ===========================================================================
  brightbean-postgres:
    image: postgres:16-alpine
    container_name: cc-brightbean-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brightbean
      POSTGRES_USER: brightbean
      POSTGRES_PASSWORD: ${BRIGHTBEAN_POSTGRES_PASSWORD}
    volumes:
      - brightbean_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightbean"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxy

  brightbean-migrate:
    build: ./brightbean-studio
    container_name: cc-brightbean-migrate
    command: python manage.py migrate --noinput
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${BRIGHTBEAN_SECRET_KEY}
      ENCRYPTION_KEY_SALT: ${BRIGHTBEAN_ENCRYPTION_KEY_SALT}
      DEBUG: "false"
      ALLOWED_HOSTS: brightbean.example.com
      APP_URL: https://brightbean.example.com
      DATABASE_URL: postgres://brightbean:${BRIGHTBEAN_POSTGRES_PASSWORD}@brightbean-postgres:5432/brightbean
      STORAGE_BACKEND: local
      MEDIA_ROOT: /app/media
    depends_on:
      brightbean-postgres:
        condition: service_healthy
    networks:
      - proxy

  brightbean-app:
    build: ./brightbean-studio
    container_name: cc-brightbean-app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    volumes:
      - brightbean_media_data:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${BRIGHTBEAN_SECRET_KEY}
      ENCRYPTION_KEY_SALT: ${BRIGHTBEAN_ENCRYPTION_KEY_SALT}
      DEBUG: "false"
      ALLOWED_HOSTS: brightbean.example.com
      APP_URL: https://brightbean.example.com
      DATABASE_URL: postgres://brightbean:${BRIGHTBEAN_POSTGRES_PASSWORD}@brightbean-postgres:5432/brightbean
      STORAGE_BACKEND: local
      MEDIA_ROOT: /app/media
    depends_on:
      brightbean-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.brightbean.rule=Host(`brightbean.example.com`)"
      - "traefik.http.routers.brightbean.entrypoints=websecure"
      - "traefik.http.routers.brightbean.tls=true"
      - "traefik.http.routers.brightbean.middlewares=authelia-auth@file,security-headers@file"
      - "traefik.http.services.brightbean.loadbalancer.server.port=8000"
    networks:
      - proxy

  brightbean-worker:
    build: ./brightbean-studio
    container_name: cc-brightbean-worker
    command: python manage.py process_tasks
    volumes:
      - brightbean_media_data:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${BRIGHTBEAN_SECRET_KEY}
      ENCRYPTION_KEY_SALT: ${BRIGHTBEAN_ENCRYPTION_KEY_SALT}
      DEBUG: "false"
      ALLOWED_HOSTS: brightbean.example.com
      APP_URL: https://brightbean.example.com
      DATABASE_URL: postgres://brightbean:${BRIGHTBEAN_POSTGRES_PASSWORD}@brightbean-postgres:5432/brightbean
      STORAGE_BACKEND: local
      MEDIA_ROOT: /app/media
    depends_on:
      brightbean-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - proxy

  # ===========================================================================
  #  Fish Speech — TTS / clonage vocal (Gradio WebUI, GPU NVIDIA)
  #  Exposé sur https://fish.example.com (sous-domaine 1 niveau, SSL gratuit)
  #  Protégé par Authelia (id + mdp + 2FA) via authelia-auth@file.
  #  ⚠️ Gradio ne gère pas proprement le sous-chemin (/fish) → sous-domaine.
  #  ⚠️ S2 Pro ≈ 24 GB VRAM recommandé ; RTX 5080 = 16 GB → OOM possible sur
  #     de longues générations (le modèle charge en bf16). Voir README.
  # ===========================================================================
  fish-webui:
    image: content-creation-fish-webui:cuda
    container_name: cc-fish-webui
    restart: unless-stopped
    # Le HEALTHCHECK de l'image teste /health, mais la WebUI Gradio ne l'expose
    # pas (404) → conteneur "unhealthy" et Traefik le filtre (router absent).
    # On teste la racine / qui répond 200.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      COMPILE: "0"   # pas de torch.compile (économise de la VRAM)
      LLAMA_CHECKPOINT_PATH: "checkpoints/s2-pro-int8"   # modèle quantifié int8 (16 GB VRAM)
      DECODER_CHECKPOINT_PATH: "checkpoints/s2-pro-int8/codec.pth"
    volumes:
      - ./fish-speech/checkpoints:/app/checkpoints
      - ./fish-speech/references:/app/references
      - ./patches/fish-speech/inference.py:/app/fish_speech/models/text2semantic/inference.py:ro
      - ./patches/fish-speech/dac_inference.py:/app/fish_speech/models/dac/inference.py:ro
      - ./patches/fish-speech/modded_dac.py:/app/fish_speech/models/dac/modded_dac.py:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fish.rule=Host(`fish.example.com`)"
      - "traefik.http.routers.fish.entrypoints=websecure"
      - "traefik.http.routers.fish.tls=true"
      - "traefik.http.routers.fish.middlewares=authelia-auth@file,security-headers@file"
      - "traefik.http.services.fish.loadbalancer.server.port=7860"
    networks:
      - proxy

